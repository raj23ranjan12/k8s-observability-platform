iname: Deploy App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t platform-app .

    - name: Run container test
      run: docker run -d -p 5000:5000 platform-app
